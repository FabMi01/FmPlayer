<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Freebox Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Freebox Player">
<meta name="theme-color" content="#15171b">
<style>
:root{--bg:#15171b;--panel:#1d2025;--line:#2a2e35;--text:#efede8;--dim:#8d929b;--red:#d71920;box-sizing:border-box}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;padding:8px;cursor:pointer}
.ic{width:40px;height:40px;border-radius:50%;background:var(--panel);display:grid;place-items:center;padding:0}
.ic svg{width:20px;height:20px;fill:currentColor}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--dim)}
.row.cur .n{color:var(--red);font-weight:600}
.row svg{width:22px;height:22px;fill:var(--dim);flex:none}
.empty{padding:40px 24px;color:var(--dim);text-align:center}
#player{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.seek{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--red);height:28px;margin:0}
.ctl{display:flex;justify-content:center;align-items:center;gap:28px}
.ctl .ic{background:none}
.ctl .ic svg{width:28px;height:28px}
.ctl .play{width:60px;height:60px;background:var(--red)}
.ctl .play svg{width:28px;height:28px}
#setup{position:fixed;inset:0;background:var(--bg);z-index:5;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;overflow-y:auto}
#setup[hidden]{display:none}
#setup h2{margin:6px 0 4px;font-size:24px}
#setup p{color:var(--dim);margin:6px 0 16px}
label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px}
input[type=url]{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border-radius:12px;background:var(--red);font-weight:600;text-align:center}
.btn.alt{background:var(--panel);margin-top:10px}
#msg{margin-top:16px;min-height:22px;color:var(--dim)}
#msg.err{color:#ff7a7f}
</style>
</head>
<body>
<header>
  <button class="ic" id="back" aria-label="Dossier parent" hidden><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
  <h1 id="crumb">Freebox</h1>
  <button class="ic" id="gear" aria-label="Réglages"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.700 7.700 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.700 1.700 1l.3 2.700h4l.4-2.700c.6-.3 1.200-.6 1.700-1l2.500 1 2-3.500zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
</header>
<div id="list"></div>
<div id="player">
  <div id="title">Aucun titre</div>
  <div id="sub">Choisissez un morceau</div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="ic" id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.500 6 8.500 6V6z"/></svg></button>
    <button class="ic play" id="pp" aria-label="Lecture"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ic" id="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.500-6L6 6z"/></svg></button>
  </div>
</div>

<div id="setup">
  <h2>Connexion à la Freebox</h2>
  <p>Indiquez l'adresse de votre Freebox. En déplacement, activez d'abord votre VPN (WireGuard) puis utilisez l'adresse locale.</p>
  <label for="url">Adresse de la Freebox</label>
  <input type="url" id="url" placeholder="https://xxxxxxxx.fbxos.fr:12345" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="btn" id="go">Se connecter</button>
  <button class="btn alt" id="reset">Oublier cette Freebox</button>
  <div id="msg"></div>
</div>

<audio id="au" preload="auto" playsinline></audio>

<script>
const $=s=>document.querySelector(s);
const ST={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const APP_ID='fr.perso.freeboxplayer';
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',wav:'audio/wav',aif:'audio/aiff',aiff:'audio/aiff',alac:'audio/mp4'};
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const isAudio=f=>f.type==='file'&&ext(f.name) in MIME;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const au=$('#au');

/* ---- HMAC-SHA1 (JS pur : fonctionne aussi hors HTTPS) ---- */
function sha1(b){const l=b.length,n=((l+8)>>6)+1,w=new Uint32Array(n*16);
 for(let i=0;i<l;i++)w[i>>2]|=b[i]<<(24-(i&3)*8);
 w[l>>2]|=0x80<<(24-(l&3)*8);w[n*16-1]=l*8;
 let h0=0x67452301,h1=0xEFCDAB89|0,h2=0x98BADCFE|0,h3=0x10325476,h4=0xC3D2E1F0|0;
 const rol=(x,c)=>(x<<c)|(x>>>(32-c));
 for(let i=0;i<w.length;i+=16){const x=new Uint32Array(80);
  for(let j=0;j<16;j++)x[j]=w[i+j];
  for(let j=16;j<80;j++)x[j]=rol(x[j-3]^x[j-8]^x[j-14]^x[j-16],1);
  let a=h0,b2=h1,c=h2,d=h3,e=h4;
  for(let j=0;j<80;j++){let f,k;
   if(j<20){f=(b2&c)|(~b2&d);k=0x5A827999}
   else if(j<40){f=b2^c^d;k=0x6ED9EBA1}
   else if(j<60){f=(b2&c)|(b2&d)|(c&d);k=0x8F1BBCDC|0}
   else{f=b2^c^d;k=0xCA62C1D6|0}
   const t=(rol(a,5)+f+e+k+x[j])|0;e=d;d=c;c=rol(b2,30);b2=a;a=t}
  h0=(h0+a)|0;h1=(h1+b2)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0}
 const o=new Uint8Array(20);[h0,h1,h2,h3,h4].forEach((h,i)=>{o[i*4]=h>>>24;o[i*4+1]=h>>>16;o[i*4+2]=h>>>8;o[i*4+3]=h});return o}
function hmacHex(key,msg){const e=new TextEncoder();let k=e.encode(key);if(k.length>64)k=sha1(k);
 const ip=new Uint8Array(64+e.encode(msg).length),op=new Uint8Array(84);
 for(let i=0;i<64;i++){const kb=k[i]||0;ip[i]=kb^0x36;op[i]=kb^0x5c}
 ip.set(e.encode(msg),64);op.set(sha1(ip),64);
 return Array.from(sha1(op),x=>x.toString(16).padStart(2,'0')).join('')}

/* ---- API Freebox OS ---- */
let base=ST.get('fbx_base')||'',appToken=ST.get('fbx_token')||'',session='';
const msg=(t,err)=>{const m=$('#msg');m.textContent=t;m.className=err?'err':''};
async function api(path,opt={},retry=true){
 const h={...(opt.headers||{})};if(session)h['X-Fbx-App-Auth']=session;
 const r=await fetch(base+'/api/v4/'+path,{...opt,headers:h});
 if(r.status===403&&retry&&appToken&&path.indexOf('login')!==0){await login();return api(path,opt,false)}
 return r}
async function authorize(){
 const r=await api('login/authorize/',{method:'POST',body:JSON.stringify({app_id:APP_ID,app_name:'Freebox Player',app_version:'1.0',device_name:'iPhone'})});
 const j=await r.json();if(!j.success)throw new Error('Autorisation refusée par la Freebox');
 const tok=j.result.app_token,id=j.result.track_id;
 msg('Appuyez sur la flèche droite de l\u2019écran de la Freebox pour autoriser l\u2019application.');
 for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,2000));
  const s=await(await api('login/authorize/'+id)).json();const st=s.result&&s.result.status;
  if(st==='granted'){appToken=tok;ST.set('fbx_token',tok);return}
  if(st&&st!=='pending')throw new Error('Autorisation '+(st==='timeout'?'expirée':'refusée'))}
 throw new Error('Autorisation expirée')}
async function login(){
 session='';
 const c=await(await api('login/')).json();
 const pw=hmacHex(appToken,c.result.challenge);
 const s=await(await api('login/session/',{method:'POST',body:JSON.stringify({app_id:APP_ID,password:pw})})).json();
 if(!s.success)throw new Error('Connexion refusée : '+(s.msg||'vérifiez les droits de l\u2019application'));
 session=s.result.session_token}
async function connect(){
 let u=$('#url').value.trim().replace(/\/+$/,'');if(!u)return msg('Saisissez une adresse.',1);
 base=u;msg('Connexion…');
 try{
  await fetch(base+'/api_version').then(r=>r.json());
  if(!appToken)await authorize();
  await login();ST.set('fbx_base',base);
  $('#setup').hidden=true;stack=[{name:'Freebox',path:btoa('/')}];await browse()
 }catch(e){msg((e.name==='TypeError'?'Freebox injoignable (adresse, VPN, HTTPS ou CORS) : ':'')+e.message,1)}}

/* ---- Navigation ---- */
let stack=[],items=[],queue=[],idx=-1;
const ICO={dir:'<svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>',file:'<svg viewBox="0 0 24 24"><path d="M12 3v10.600a4 4 0 1 0 2 3.400V7h4V3z"/></svg>'};
async function browse(){
 const cur=stack[stack.length-1];$('#crumb').textContent=cur.name;$('#back').hidden=stack.length<2;
 const L=$('#list');L.innerHTML='<div class="empty">Chargement…</div>';
 try{
  const j=await(await api('fs/ls/'+cur.path)).json();
  if(!j.success)throw new Error(j.msg||'Dossier inaccessible (droit « explorateur de fichiers » ?)');
  items=j.result.filter(f=>f.name!=='.'&&f.name!=='..'&&!f.hidden&&(f.type==='dir'||isAudio(f)))
   .sort((a,b)=>(a.type===b.type?0:a.type==='dir'?-1:1)||a.name.localeCompare(b.name,'fr',{numeric:true}));
  queue=items.filter(f=>f.type==='file');render()
 }catch(e){L.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function render(){
 const L=$('#list');
 if(!items.length){L.innerHTML='<div class="empty">Aucun dossier ni fichier audio ici.</div>';return}
 L.innerHTML=items.map((f,i)=>'<button class="row'+(playing&&playing.path===f.path?' cur':'')+'" data-i="'+i+'">'+ICO[f.type==='dir'?'dir':'file']+'<span class="n">'+esc(f.type==='dir'?f.name:f.name.replace(/\.[^.]+$/,''))+'</span>'+(f.type==='file'?'<small>'+ext(f.name)+'</small>':'')+'</button>').join('')}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.row');if(!b)return;unlock();
 const f=items[+b.dataset.i];
 if(f.type==='dir'){stack.push({name:f.name,path:f.path});browse()}
 else{idx=queue.findIndex(q=>q.path===f.path);play()}});
$('#back').onclick=()=>{if(stack.length>1){stack.pop();browse()}};

/* ---- Lecture ---- */
let playing=null,objUrl='',token=0;
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let unlocked=false;
function unlock(){if(unlocked)return;unlocked=true;au.src=SILENT;au.play().catch(()=>{})}
async function play(){
 const f=queue[idx];if(!f)return;const my=++token;playing=f;render();
 $('#title').textContent=f.name.replace(/\.[^.]+$/,'');$('#sub').textContent='Chargement…';
 try{
  const r=await api('dl/'+f.path);if(!r.ok)throw new Error('Téléchargement impossible ('+r.status+')');
  const buf=await r.arrayBuffer();if(my!==token)return;
  if(objUrl)URL.revokeObjectURL(objUrl);
  objUrl=URL.createObjectURL(new Blob([buf],{type:MIME[ext(f.name)]}));
  au.src=objUrl;await au.play();
  $('#sub').textContent=stack[stack.length-1].name;meta(f)
 }catch(e){if(my===token)$('#sub').textContent=e.message}}
const step=d=>{if(!queue.length)return;idx=(idx+d+queue.length)%queue.length;play()};
$('#next').onclick=()=>step(1);$('#prev').onclick=()=>au.currentTime>3?(au.currentTime=0):step(-1);
$('#pp').onclick=()=>{unlock();if(!au.src||au.src===SILENT||!playing)return;au.paused?au.play():au.pause()};
au.onended=()=>step(1);
const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
au.onplay=au.onpause=()=>{$('#ppi').innerHTML=au.paused?PLAY:PAUSE;if('mediaSession'in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing'};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
let drag=false;
au.ontimeupdate=()=>{$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration);if(!drag&&au.duration)$('#seek').value=au.currentTime/au.duration*1000};
$('#seek').oninput=()=>{drag=true;$('#cur').textContent=fmt($('#seek').value/1000*au.duration)};
$('#seek').onchange=()=>{if(au.duration)au.currentTime=$('#seek').value/1000*au.duration;drag=false};
function meta(f){if(!('mediaSession'in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:f.name.replace(/\.[^.]+$/,''),artist:stack[stack.length-1].name,album:'Freebox'});
 const A=navigator.mediaSession;A.setActionHandler('play',()=>au.play());A.setActionHandler('pause',()=>au.pause());
 A.setActionHandler('previoustrack',()=>step(-1));A.setActionHandler('nexttrack',()=>step(1));
 A.setActionHandler('seekto',d=>{au.currentTime=d.seekTime})}

/* ---- Réglages ---- */
$('#gear').onclick=()=>{$('#url').value=base;msg('');$('#setup').hidden=false};
$('#go').onclick=connect;
$('#reset').onclick=()=>{ST.del('fbx_base');ST.del('fbx_token');base='';appToken='';session='';$('#url').value='';msg('Freebox oubliée.')};
$('#url').value=base;
if(base&&appToken){$('#setup').hidden=true;stack=[{name:'Freebox',path:btoa('/')}];login().then(browse).catch(()=>{$('#setup').hidden=false;msg('Reconnexion impossible : vérifiez le VPN ou l\u2019adresse.',1)})}
</script>
</body>
</html>
