<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Freebox Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Freebox Player">
<meta name="theme-color" content="#15171b">
<style>
:root{--bg:#15171b;--panel:#1d2025;--line:#2a2e35;--text:#efede8;--dim:#8d929b;--red:#d71920;box-sizing:border-box}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;padding:8px;cursor:pointer}
.ic{width:40px;height:40px;border-radius:50%;background:var(--panel);display:grid;place-items:center;padding:0}
.ic svg{width:20px;height:20px;fill:currentColor}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--dim);font-variant-numeric:tabular-nums}
.row.cur .n,.row.cur small{color:var(--red);font-weight:600}
.empty{padding:40px 24px;color:var(--dim);text-align:center}
#player{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.seek{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--red);height:28px;margin:0}
.ctl{display:flex;justify-content:center;align-items:center;gap:28px}
.ctl .ic{background:none}
.ctl .ic svg{width:28px;height:28px}
.ctl .play{width:60px;height:60px;background:var(--red)}
#setup{position:fixed;inset:0;background:var(--bg);z-index:5;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;overflow-y:auto}
#setup[hidden]{display:none}
#setup h2{margin:6px 0 4px;font-size:24px}
#setup p{color:var(--dim);margin:6px 0 16px}
label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border-radius:12px;background:var(--red);font-weight:600;text-align:center}
.btn.alt{background:var(--panel);margin-top:10px}
#msg{margin-top:16px;min-height:22px;color:var(--dim);word-break:break-word}
#msg.err{color:#ff7a7f}
</style>
</head>
<body>
<header>
  <h1 id="crumb">Freebox Player</h1>
  <button class="ic" id="gear" aria-label="Réglages"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 5v-2l-2.300-.7a7 7 0 0 0-.7-1.700l1.100-2.100-1.400-1.400-2.100 1.100a7 7 0 0 0-1.700-.7L13 3h-2l-.7 2.500a7 7 0 0 0-1.700.7L6.500 5.100 5.100 6.500l1.100 2.100a7 7 0 0 0-.7 1.700L3 11v2l2.500.7c.2.600.4 1.200.7 1.700l-1.100 2.100 1.400 1.400 2.100-1.100c.5.300 1.100.5 1.700.7L11 21h2l.7-2.500c.6-.2 1.200-.4 1.700-.7l2.100 1.100 1.400-1.400-1.100-2.100c.3-.5.500-1.100.7-1.700z"/></svg></button>
</header>
<div id="list"></div>
<div id="player">
  <div id="title">Aucun titre</div>
  <div id="sub">Choisissez un morceau</div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="ic" id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.500 6 8.500 6V6z"/></svg></button>
    <button class="ic play" id="pp" aria-label="Lecture"><svg viewBox="0 0 24 24" id="ppi" style="width:28px;height:28px"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ic" id="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.500-6L6 6z"/></svg></button>
  </div>
</div>

<div id="setup">
  <h2>Ma playlist Freebox</h2>
  <p>Collez le lien de partage de votre fichier .m3u. La connexion sécurisée (HTTPS) est utilisée automatiquement.</p>
  <label for="link">Lien du fichier .m3u</label>
  <input type="text" id="link" placeholder="xxxx.fbxos.fr:PORT/share/…/playlist.m3u" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label for="relay">Relais Cloudflare (facultatif, si le chargement échoue)</label>
  <input type="text" id="relay" placeholder="https://….workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="btn" id="go">Charger la playlist</button>
  <button class="btn alt" id="reset">Oublier</button>
  <div id="msg"></div>
</div>

<audio id="au" preload="auto" playsinline></audio>

<script>
const $=s=>document.querySelector(s);
const ST={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const au=$('#au'),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=(t,err)=>{const m=$('#msg');m.textContent=t;m.className=err?'err':''};
const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
const enc=s=>encodeURIComponent(dec(s));
const HTTPS_PORT='45030';
let tracks=[],idx=-1;

/* ---- Chargement de la playlist ---- */
async function loadM3U(raw,relay){
 const u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);
 const ports=[...new Set([u.port,HTTPS_PORT].filter(Boolean))],errs=[];
 for(const p of ports){
  const url='https://'+u.hostname+':'+p+u.pathname;
  try{const r=await fetch(url);if(r.ok)return{url,port:p,host:u.hostname,text:await r.text()};errs.push(p+' → HTTP '+r.status)}
  catch(e){errs.push(p+' → '+e.message)}}
 if(relay){
  try{const r=await fetch(relay.replace(/\/+$/,'')+u.pathname);
   if(r.ok)return{url:'https://'+u.hostname+':'+HTTPS_PORT+u.pathname,port:HTTPS_PORT,host:u.hostname,text:await r.text()};
   errs.push('relais → HTTP '+r.status)}catch(e){errs.push('relais → '+e.message)}}
 throw new Error('Playlist inaccessible ('+errs.join(' ; ')+')')}

function parse(text,src){
 const dir=src.url.slice(0,src.url.lastIndexOf('/')+1),out=[];let title='';
 for(let l of text.replace(/^\uFEFF/,'').split(/\r?\n/)){
  l=l.trim();if(!l)continue;
  if(l.startsWith('#EXTINF')){title=l.includes(',')?l.slice(l.indexOf(',')+1).trim():'';continue}
  if(l.startsWith('#'))continue;
  let url,name;
  if(/^https?:\/\//i.test(l)){
   try{const x=new URL(l);x.protocol='https:';if(x.hostname===src.host)x.port=src.port;url=x.href;name=dec(x.pathname.split('/').pop())}catch(e){continue}
  }else{
   const abs=l[0]==='/'||/^[A-Za-z]:[\\/]/.test(l)||l.includes('\\');
   const parts=abs?[l.split(/[\\/]/).pop()]:l.split('/');
   url=dir+parts.map(enc).join('/');name=dec(parts[parts.length-1])}
  out.push({url,title:title||name.replace(/\.[^.]+$/,'')});title=''}
 return out}

async function start(){
 const link=$('#link').value.trim(),relay=$('#relay').value.trim();
 if(!link)return msg('Collez le lien du fichier .m3u.',1);
 msg('Chargement…');
 try{
  const src=await loadM3U(link,relay);
  tracks=parse(src.text,src);
  if(!tracks.length)throw new Error('La playlist est vide ou illisible.');
  ST.set('fbx_link',link);ST.set('fbx_relay',relay);
  $('#crumb').textContent=decodeURIComponent(src.url.split('/').pop()).replace(/\.m3u8?$/i,'');
  $('#setup').hidden=true;idx=-1;render()
 }catch(e){msg(e.message,1)}}

function render(){
 $('#list').innerHTML=tracks.map((t,i)=>'<button class="row'+(i===idx?' cur':'')+'" data-i="'+i+'"><small>'+(i+1)+'</small><span class="n">'+esc(t.title)+'</span></button>').join('')}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.row');if(b)play(+b.dataset.i)});

/* ---- Lecture (streaming direct, sans authentification) ---- */
function play(i){
 if(!tracks.length)return;idx=(i+tracks.length)%tracks.length;const t=tracks[idx];
 au.src=t.url;au.play().catch(()=>{});render();
 $('#title').textContent=t.title;$('#sub').textContent='Chargement…';
 const cur=$('#list .cur');if(cur)cur.scrollIntoView({block:'nearest'});
 if('mediaSession'in navigator){const A=navigator.mediaSession;
  A.metadata=new MediaMetadata({title:t.title,artist:$('#crumb').textContent,album:'Freebox'});
  A.setActionHandler('play',()=>au.play());A.setActionHandler('pause',()=>au.pause());
  A.setActionHandler('previoustrack',()=>play(idx-1));A.setActionHandler('nexttrack',()=>play(idx+1));
  A.setActionHandler('seekto',d=>{au.currentTime=d.seekTime})}}
au.onplaying=()=>{$('#sub').textContent=$('#crumb').textContent};
au.onerror=()=>{$('#sub').textContent='Lecture impossible : '+(tracks[idx]?decodeURIComponent(tracks[idx].url).slice(0,90):'')};
au.onended=()=>play(idx+1);
$('#next').onclick=()=>play(idx+1);
$('#prev').onclick=()=>au.currentTime>3?(au.currentTime=0):play(idx-1);
$('#pp').onclick=()=>{if(idx<0)return play(0);au.paused?au.play():au.pause()};
const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
au.onplay=au.onpause=()=>{$('#ppi').innerHTML=au.paused?PLAY:PAUSE;if('mediaSession'in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing'};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
let drag=false;
au.ontimeupdate=()=>{$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration);if(!drag&&au.duration)$('#seek').value=au.currentTime/au.duration*1000};
$('#seek').oninput=()=>{drag=true;$('#cur').textContent=fmt($('#seek').value/1000*au.duration)};
$('#seek').onchange=()=>{if(au.duration)au.currentTime=$('#seek').value/1000*au.duration;drag=false};

/* ---- Réglages ---- */
$('#gear').onclick=()=>{msg('');$('#setup').hidden=false};
$('#go').onclick=start;
$('#reset').onclick=()=>{ST.del('fbx_link');ST.del('fbx_relay');$('#link').value='';$('#relay').value='';msg('Oublié.')};
$('#link').value=ST.get('fbx_link');$('#relay').value=ST.get('fbx_relay');
if($('#link').value)start();
</script>
</body>
</html>
